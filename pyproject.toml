[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "base120-mcp"
version = "0.1.0"
description = "120 Validated Mental Models for Claude, Cursor, and LLMs via Model Context Protocol (MCP)"
readme = "README.md"
license = "Apache-2.0 OR MIT"
license-files = ["LICENSE-APACHE", "LICENSE-MIT"]
authors = [{ name = "Reuben Bowlby", email = "reuben@hummbl.io" }]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
base120 = "base120_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["base120_mcp*"]
exclude = ["assets*", "tests*", "examples*"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
