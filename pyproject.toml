[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "base120-mcp"
version = "0.1.0"
description = "120 Validated Mental Models for Claude, Cursor, and LLMs via Model Context Protocol (MCP)"
readme = "README.md"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Reuben Bowlby", email = "reuben@hummbl.io" }]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
