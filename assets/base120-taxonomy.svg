<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 310" width="100%" height="100%">
  <defs>
    <linearGradient id="b120-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0e1726" />
    </linearGradient>
    <filter id="card-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1000" height="310" rx="16" fill="url(#b120-bg)" stroke="#1e293b" stroke-width="2" />

  <text x="30" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" fill="#f8fafc">
    Base120 Canonical 6 Transformations Architecture <tspan fill="#94a3b8" font-size="14" font-weight="400">(120 Mental Models)</tspan>
  </text>

  <!-- 6 Columns -->
  <!-- 1. P: Perspective -->
  <g transform="translate(25, 75)" filter="url(#card-glow)">
    <rect width="148" height="205" rx="10" fill="#1e1b4b" fill-opacity="0.6" stroke="#6366f1" stroke-width="1.5" />
    <text x="14" y="28" font-family="sans-serif" font-size="14" font-weight="700" fill="#818cf8">P: Perspective</text>
    <text x="14" y="48" font-family="sans-serif" font-size="10.5" fill="#c7d2fe">20 Models (P1-P20)</text>
    <line x1="14" y1="58" x2="134" y2="58" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1" />
    <text x="14" y="80" font-family="sans-serif" font-size="11" fill="#e0e7ff">• First Principles</text>
    <text x="14" y="105" font-family="sans-serif" font-size="11" fill="#e0e7ff">• Stakeholder Map</text>
    <text x="14" y="130" font-family="sans-serif" font-size="11" fill="#e0e7ff">• Identity Stack</text>
    <text x="14" y="155" font-family="sans-serif" font-size="11" fill="#e0e7ff">• Lens Shifting</text>
  </g>

  <!-- 2. IN: Inversion -->
  <g transform="translate(185, 75)" filter="url(#card-glow)">
    <rect width="148" height="205" rx="10" fill="#450a0a" fill-opacity="0.6" stroke="#ef4444" stroke-width="1.5" />
    <text x="14" y="28" font-family="sans-serif" font-size="14" font-weight="700" fill="#f87171">IN: Inversion</text>
    <text x="14" y="48" font-family="sans-serif" font-size="10.5" fill="#fecaca">20 Models (IN1-IN20)</text>
    <line x1="14" y1="58" x2="134" y2="58" stroke="#ef4444" stroke-opacity="0.4" stroke-width="1" />
    <text x="14" y="80" font-family="sans-serif" font-size="11" fill="#fee2e2">• Subtractive Think</text>
    <text x="14" y="105" font-family="sans-serif" font-size="11" fill="#fee2e2">• Premortem Analysis</text>
    <text x="14" y="130" font-family="sans-serif" font-size="11" fill="#fee2e2">• Problem Reversal</text>
    <text x="14" y="155" font-family="sans-serif" font-size="11" fill="#fee2e2">• Red Teaming</text>
  </g>

  <!-- 3. CO: Composition -->
  <g transform="translate(345, 75)" filter="url(#card-glow)">
    <rect width="148" height="205" rx="10" fill="#064e3b" fill-opacity="0.6" stroke="#10b981" stroke-width="1.5" />
    <text x="14" y="28" font-family="sans-serif" font-size="14" font-weight="700" fill="#34d399">CO: Composition</text>
    <text x="14" y="48" font-family="sans-serif" font-size="10.5" fill="#a7f3d0">20 Models (C01-CO20)</text>
    <line x1="14" y1="58" x2="134" y2="58" stroke="#10b981" stroke-opacity="0.4" stroke-width="1" />
    <text x="14" y="80" font-family="sans-serif" font-size="11" fill="#d1fae5">• Synergy Principle</text>
    <text x="14" y="105" font-family="sans-serif" font-size="11" fill="#d1fae5">• Chunking</text>
    <text x="14" y="130" font-family="sans-serif" font-size="11" fill="#d1fae5">• Emergence</text>
    <text x="14" y="155" font-family="sans-serif" font-size="11" fill="#d1fae5">• Network Effects</text>
  </g>

  <!-- 4. DE: Decompose -->
  <g transform="translate(505, 75)" filter="url(#card-glow)">
    <rect width="148" height="205" rx="10" fill="#3b0764" fill-opacity="0.6" stroke="#a855f7" stroke-width="1.5" />
    <text x="14" y="28" font-family="sans-serif" font-size="14" font-weight="700" fill="#c084fc">DE: Decompose</text>
    <text x="14" y="48" font-family="sans-serif" font-size="10.5" fill="#e9d5ff">20 Models (DE1-DE20)</text>
    <line x1="14" y1="58" x2="134" y2="58" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1" />
    <text x="14" y="80" font-family="sans-serif" font-size="11" fill="#f3e8ff">• 5-Whys Root Cause</text>
    <text x="14" y="105" font-family="sans-serif" font-size="11" fill="#f3e8ff">• Factorization</text>
    <text x="14" y="130" font-family="sans-serif" font-size="11" fill="#f3e8ff">• 80/20 Pareto</text>
    <text x="14" y="155" font-family="sans-serif" font-size="11" fill="#f3e8ff">• Partition-Conquer</text>
  </g>

  <!-- 5. RE: Recursion -->
  <g transform="translate(665, 75)" filter="url(#card-glow)">
    <rect width="148" height="205" rx="10" fill="#14532d" fill-opacity="0.6" stroke="#22c55e" stroke-width="1.5" />
    <text x="14" y="28" font-family="sans-serif" font-size="14" font-weight="700" fill="#4ade80">RE: Recursion</text>
    <text x="14" y="48" font-family="sans-serif" font-size="10.5" fill="#bbf7d0">20 Models (RE1-RE20)</text>
    <line x1="14" y1="58" x2="134" y2="58" stroke="#22c55e" stroke-opacity="0.4" stroke-width="1" />
    <text x="14" y="80" font-family="sans-serif" font-size="11" fill="#dcfce7">• Kaizen Cycles</text>
    <text x="14" y="105" font-family="sans-serif" font-size="11" fill="#dcfce7">• Feedback Loops</text>
    <text x="14" y="130" font-family="sans-serif" font-size="11" fill="#dcfce7">• Meta-Learning</text>
    <text x="14" y="155" font-family="sans-serif" font-size="11" fill="#dcfce7">• Guardrails Learn</text>
  </g>

  <!-- 6. SY: Systems -->
  <g transform="translate(825, 75)" filter="url(#card-glow)">
    <rect width="148" height="205" rx="10" fill="#0c4a6e" fill-opacity="0.6" stroke="#0284c7" stroke-width="1.5" />
    <text x="14" y="28" font-family="sans-serif" font-size="14" font-weight="700" fill="#38bdf8">SY: Systems</text>
    <text x="14" y="48" font-family="sans-serif" font-size="10.5" fill="#bae6fd">20 Models (SY1-SY20)</text>
    <line x1="14" y1="58" x2="134" y2="58" stroke="#0284c7" stroke-opacity="0.4" stroke-width="1" />
    <text x="14" y="80" font-family="sans-serif" font-size="11" fill="#e0f2fe">• Leverage Points</text>
    <text x="14" y="105" font-family="sans-serif" font-size="11" fill="#e0f2fe">• System Bounds</text>
    <text x="14" y="130" font-family="sans-serif" font-size="11" fill="#e0f2fe">• Stocks &amp; Flows</text>
    <text x="14" y="155" font-family="sans-serif" font-size="11" fill="#e0f2fe">• Ashby's Variety</text>
  </g>
</svg>
